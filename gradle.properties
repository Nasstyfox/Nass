# AndroidX (required for Compose + modern libraries)
android.useAndroidX=true
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# JVM args for Gradle daemon (helps with Compose builds)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX auto-migration
android.nonTransitiveRClass=true

# --- Release signing (do NOT commit real values) ---
NASS_STORE_FILE=nass-release-key.jks
NASS_STORE_PASSWORD=your_keystore_password
NASS_KEY_ALIAS=nass
NASS_KEY_PASSWORD=your_key_password